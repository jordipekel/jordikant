<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FLAPPY JORDI ARCADE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-touch-callout: none; }
        body { background: #050510; color: #fff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 480px; max-width: 95vw; background: #000; border: 4px solid #00ffcc; box-shadow: 0 0 20px #00ffcc; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #ffe600; text-shadow: 0 0 8px #00ffcc; margin-bottom: 5px; font-size: 26px; text-align: center; }
        
        canvas { 
            background: #000; 
            border: 3px solid #ff0055; 
            border-radius: 4px; 
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            cursor: pointer;
        }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; z-index: 10; border-radius: 6px; }
        .overlay h2 { color: #00ffcc; margin-bottom: 15px; text-shadow: 0 0 10px #00ffcc; font-size: 24px; }
        .input-group { margin: 15px 0; }
        input[type="text"] { background: #111; border: 2px solid #00ffcc; color: #fff; padding: 10px; font-family: inherit; font-size: 18px; text-align: center; text-transform: uppercase; width: 220px; outline: none; border-radius: 5px; }
        button { background: #ff0055; color: #fff; border: none; padding: 12px 24px; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 5px; box-shadow: 0 0 10px #ff0055; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        
        .score-board { width: 90%; margin-top: 15px; background: #111; padding: 10px; border-radius: 5px; border: 1px solid #333; }
        .score-board h3 { color: #ffe600; font-size: 14px; margin-bottom: 8px; }
        .score-list { list-style: none; font-size: 14px; color: #00ffcc; text-align: left; }
        .score-list li { display: flex; justify-content: space-between; padding: 3px 10px; }

        #hud { display: flex; justify-content: space-between; width: 100%; padding: 5px 5px; color: #fff; font-size: 14px; font-weight: bold; }
        .hint { margin-top: 8px; color: #888; font-size: 12px; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>FLAPPY JORDI ARCADE</h1>
    
    <div id="hud">
        <span id="player-display">SPELER: -</span>
        <span id="score-display" style="color:#ffe600;">SCORE: 0</span>
        <span id="best-display" style="color:#00ffcc;">BEST: 0</span>
    </div>

    <canvas id="canvas" width="400" height="560"></canvas>
    <div class="hint">TIK OF DRUK OMHOOG OM TE VLIEGEN</div>

    <!-- START SCREEN -->
    <div id="start-screen" class="overlay">
        <h2>VOER NAAM IN</h2>
        <div class="input-group">
            <input type="text" id="player-name" placeholder="NAAM..." maxlength="10">
        </div>
        <button id="start-btn">START GAME</button>
        
        <div class="score-board">
            <h3>★ TOP FLAPPY SCORES ★</h3>
            <ul id="highscores-list" class="score-list"></ul>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="overlay" style="display: none;">
        <h2 style="color: #ff0055;">GAME OVER!</h2>
        <p id="final-score" style="margin-bottom: 15px; font-size: 16px; line-height: 1.5;"></p>
        <button id="restart-btn">OPNIEUW SPELEN</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Afbeelding laadlogica
const jordiImg = new Image();
jordiImg.src = 'hoofd.png';

const bgImg = new Image();
bgImg.src = 'achtergrond.png';

// Spelinstellingen & Variabelen
let currentScore = 0;
let currentPlayer = "";
let gameInterval = null;
let audioCtx = null;
let isPlaying = false;

// Jordi/Vogel Physics
const BIRD_SIZE = 36;
let bird = {
    x: 80,
    y: 250,
    vy: 0,
    gravity: 0.38,     // Soepel vallende zwaartekracht (vergevingsgezind)
    jump: -6.8,        // Voldoende sprongkracht per tik
    rotation: 0
};

// Obstakels (Pijpen) & Achtergrond
let pipes = [];
const PIPE_WIDTH = 55;
const PIPE_GAP = 145;   // Ruime opening zodat het goed speelbaar blijft
const PIPE_SPEED = 2.2; // Rustig tempo
let frameCount = 0;

// Retro sterren op de achtergrond (fallback als achtergrond.png er niet is)
let stars = [];
for (let i = 0; i < 30; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 0.5 + 0.2
    });
}

// Audio Functies
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playFlapSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}

function playScoreSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

function playGameOverSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

// Highscore Beheer (Geen dubbele namen, alleen hoogste score bijwerken)
function updateHighScoresList() {
    const scores = JSON.parse(localStorage.getItem('flappyJordiScores') || '[]');
    const listEl = document.getElementById('highscores-list');
    listEl.innerHTML = '';
    
    scores.slice(0, 5).forEach((entry) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${entry.name}</span><span>${entry.score} PTS</span>`;
        listEl.appendChild(li);
    });

    const topScore = scores.length > 0 ? scores[0].score : 0;
    document.getElementById('best-display').innerText = "BEST: " + topScore;
}

function saveHighScore(name, score) {
    let scores = JSON.parse(localStorage.getItem('flappyJordiScores') || '[]');
    let cleanName = name.toUpperCase().trim();

    // Zoek of de speler al in de highscores staat
    let existingIndex = scores.findIndex(entry => entry.name === cleanName);

    if (existingIndex !== -1) {
        // Alleen updaten als de nieuwe score HOGER is dan het persoonlijke record
        if (score > scores[existingIndex].score) {
            scores[existingIndex].score = score;
        }
    } else {
        // Nieuwe speler toevoegen
        scores.push({ name: cleanName, score: score });
    }

    // Sorteer van hoog naar laag
    scores.sort((a, b) => b.score - a.score);
    
    // Sla op op het apparaat
    localStorage.setItem('flappyJordiScores', JSON.stringify(scores));
}

// Spel Reset & Init
function initGame() {
    currentScore = 0;
    bird.y = 220;
    bird.vy = 0;
    bird.rotation = 0;
    pipes = [];
    frameCount = 0;
    isPlaying = true;
    updateHUD();
}

function updateHUD() {
    document.getElementById('score-display').innerText = "SCORE: " + currentScore;
    document.getElementById('player-display').innerText = "SPELER: " + currentPlayer.toUpperCase();
}

function flap() {
    if (!isPlaying) return;
    bird.vy = bird.jump;
    playFlapSound();
}

// Spel-Logica Update Loop
function update() {
    // 1. Vogel beweging & zwaartekracht
    bird.vy += bird.gravity;
    bird.y += bird.vy;

    // Bepaal de hoek (rotatie) op basis van de valsnelheid
    bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, bird.vy * 0.07));

    // Check botsing met de grond of het plafond
    if (bird.y + BIRD_SIZE / 2 >= canvas.height || bird.y - BIRD_SIZE / 2 <= 0) {
        gameOver();
        return;
    }

    // 2. Obstakels genereren
    frameCount++;
    if (frameCount % 100 === 0) {
        let minTop = 60;
        let maxTop = canvas.height - PIPE_GAP - 80;
        let topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

        pipes.push({
            x: canvas.width,
            topHeight: topHeight,
            bottomY: topHeight + PIPE_GAP,
            passed: false
        });
    }

    // 3. Obstakels bewegen en botsingen controleren
    for (let i = pipes.length - 1; i >= 0; i--) {
        let p = pipes[i];
        p.x -= PIPE_SPEED;

        // Check of speler de pijp passeert voor een punt
        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
            p.passed = true;
            currentScore++;
            playScoreSound();
            updateHUD();
        }

        // Botsing check (AABB Box Collision met vergevingsgezinde marge)
        let hitMargin = 6;
        let birdLeft = bird.x - BIRD_SIZE / 2 + hitMargin;
        let birdRight = bird.x + BIRD_SIZE / 2 - hitMargin;
        let birdTop = bird.y - BIRD_SIZE / 2 + hitMargin;
        let birdBottom = bird.y + BIRD_SIZE / 2 - hitMargin;

        if (birdRight > p.x && birdLeft < p.x + PIPE_WIDTH) {
            if (birdTop < p.topHeight || birdBottom > p.bottomY) {
                gameOver();
                return;
            }
        }

        // Verwijder pijpen die buiten het scherm vallen
        if (p.x + PIPE_WIDTH < 0) {
            pipes.splice(i, 1);
        }
    }

    // 4. Achtergrondsterren bewegen (indien geen achtergrond.png gebruikt wordt)
    stars.forEach(s => {
        s.x -= s.speed;
        if (s.x < 0) s.x = canvas.width;
    });
}

// Teken Functie
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Teken Achtergrond: als achtergrond.png aanwezig is wordt die getekend, anders sterren
    if (bgImg.complete && bgImg.naturalWidth !== 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => {
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });
    }

    // Teken Obstakels (Neon Groene Pijpen met Rand)
    pipes.forEach(p => {
        // Bovenste Pijp
        ctx.fillStyle = '#00ff66';
        ctx.strokeStyle = '#004411';
        ctx.lineWidth = 3;
        
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topHeight);
        ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.topHeight);
        
        // Rand onderaan bovenste pijp
        ctx.fillRect(p.x - 4, p.topHeight - 16, PIPE_WIDTH + 8, 16);
        ctx.strokeRect(p.x - 4, p.topHeight - 16, PIPE_WIDTH + 8, 16);

        // Onderste Pijp
        let bottomHeight = canvas.height - p.bottomY;
        ctx.fillRect(p.x, p.bottomY, PIPE_WIDTH, bottomHeight);
        ctx.strokeRect(p.x, p.bottomY, PIPE_WIDTH, bottomHeight);
        
        // Rand bovenaan onderste pijp
        ctx.fillRect(p.x - 4, p.bottomY, PIPE_WIDTH + 8, 16);
        ctx.strokeRect(p.x - 4, p.bottomY, PIPE_WIDTH + 8, 16);
    });

    // Teken Jordi (Vogel)
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    if (jordiImg.complete && jordiImg.naturalWidth !== 0) {
        ctx.drawImage(jordiImg, -BIRD_SIZE / 2, -BIRD_SIZE / 2, BIRD_SIZE, BIRD_SIZE);
    } else {
        // Fallback als afbeelding niet laadt: Geel bolletje met een rood snaveltje
        ctx.fillStyle = '#ffe600';
        ctx.beginPath();
        ctx.arc(0, 0, BIRD_SIZE / 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Snavel
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.moveTo(8, -4);
        ctx.lineTo(18, 0);
        ctx.lineTo(8, 4);
        ctx.closePath();
        ctx.fill();
        
        // Oogje
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(4, -6, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function gameLoop() {
    update();
    draw();
}

function gameOver() {
    isPlaying = false;
    clearInterval(gameInterval);
    playGameOverSound();
    saveHighScore(currentPlayer, currentScore);
    updateHighScoresList();
    
    document.getElementById('final-score').innerText = `SPELER: ${currentPlayer.toUpperCase()}\nSCORE: ${currentScore} PTS`;
    document.getElementById('gameover-screen').style.display = 'flex';
}

// Input Handlers (Toetsenbord + Touch + Muis)
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    flap();
});

canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    flap();
});

// UI Event Listeners
document.getElementById('start-btn').onclick = () => {
    initAudio();
    const input = document.getElementById('player-name').value.trim();
    if (!input) return alert("Voer eerst een naam in!");
    currentPlayer = input;
    document.getElementById('start-screen').style.display = 'none';
    initGame();
    gameInterval = setInterval(gameLoop, 1000 / 60); // 60 FPS
};

document.getElementById('restart-btn').onclick = () => {
    document.getElementById('gameover-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'flex';
};

// Initialisatie bij het laden
updateHighScoresList();
</script>

</body>
</html>
