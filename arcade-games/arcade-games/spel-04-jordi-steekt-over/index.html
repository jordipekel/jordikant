<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jordi Steekt Over Arcade Game</title>
<style>
:root{--cyan:#00ffd5;--pink:#ff006a;--yellow:#ffe600;--bg:#070711;--panel:#101018;--green:#00ff66}
*{box-sizing:border-box}
body{margin:0;background:#070711;color:#f7f7ff;font-family:"Courier New",monospace;min-height:100vh;display:flex;justify-content:center;padding:0}
.wrap{width:min(100%,560px);text-align:center;padding:8px}
.logo{border:3px solid var(--pink);border-radius:14px;padding:13px 10px;margin:0 auto 16px;box-shadow:0 0 12px var(--pink),inset 0 0 16px #ff006a33;background:#09090d}
.logo h1{font-size:clamp(21px,5vw,34px);margin:0;color:var(--yellow);text-shadow:0 0 8px #ffe60099;letter-spacing:1px}
.logo p{color:var(--cyan);font-size:12px;margin:7px 0 0}
.game-frame{border:2px solid var(--cyan);border-radius:10px;padding:7px;background:#050508;box-shadow:0 0 12px #00ffd566}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;margin:0 2px 9px;color:var(--cyan)}
.hud strong{color:var(--yellow)}
canvas{display:block;width:100%;height:auto;max-height:72dvh;aspect-ratio:420/600;background:#111;border:2px solid var(--pink);border-radius:4px;touch-action:none;image-rendering:pixelated}
.controls{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:48px 48px;gap:6px;justify-content:center;margin:12px auto 4px}
.ctrl{border:2px solid var(--cyan);background:#10101b;color:var(--cyan);border-radius:8px;font-size:20px;font-weight:bold;box-shadow:0 0 8px #00ffd533;touch-action:manipulation}
.ctrl:active{background:#063e37}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
button,.file-label{font-family:inherit;cursor:pointer;font-weight:bold}
.primary{background:var(--pink);border:0;border-radius:8px;color:white;padding:13px 22px;font-size:15px;box-shadow:0 0 12px #ff006a99}
.secondary,.file-label{background:#101018;color:var(--cyan);border:1px solid var(--cyan);border-radius:7px;padding:9px 12px;font-size:12px;display:inline-block}
input[type=text]{background:#0d0d14;border:2px solid var(--cyan);color:white;border-radius:7px;padding:12px;text-align:center;font:16px "Courier New",monospace;width:min(100%,270px);outline:none}

.setup,.overlay{background:#050508ee}
.setup{padding:10px 7px;border:1px solid #ffffff22;border-radius:8px;margin-bottom:8px}
.setup h2,.overlay h2{color:var(--cyan);font-size:20px;text-shadow:0 0 8px #00ffd577;margin:0 0 12px}
.setup-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.help{color:#b8b8c9;font-size:11px;line-height:1.6;margin:12px 0 2px}
.leaderboard{margin:12px 0 0;background:#101010;border:1px solid #333;border-radius:7px;padding:12px;text-align:left}
.leaderboard h3{text-align:center;color:var(--yellow);font-size:13px;margin:0 0 10px}
.score-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:4px 6px;font-size:12px;color:var(--cyan)}
.score-row .pts{color:#fff}
.status{min-height:18px;font-size:11px;color:var(--yellow);margin:7px 0}
.small{font-size:10px;color:#777}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;text-align:center}
.canvas-wrap{position:relative}
.overlay h2{color:var(--pink);font-size:25px}
.overlay p{line-height:1.7;font-size:14px}
.hidden{display:none!important}
footer{color:#777;font-size:10px;margin:10px}
@media(min-width:520px){body{padding:10px}.game-frame{padding:10px}}
</style>
</head>
<body>
<main class="wrap">
<section class="game-frame">
    <div class="setup" id="setup">
      <h2>VOER JE NAAM IN</h2>
      <div class="setup-row">
        <input id="playerName" type="text" maxlength="16" placeholder="Bijv. JORDI" autocomplete="off">
        <button class="primary" id="startBtn">PRESS START</button>
      </div>
      <p class="help">Gebruik de pijltjestoetsen, WASD of de knoppen onder het spel.<br>Steek de weg over en ontwijk het verkeer!</p>
</div>

    <div class="hud">
      <span>SPELER: <strong id="hudName">—</strong></span>
      <span>SCORE: <strong id="score">0</strong></span>
      <span>BEST: <strong id="best">0</strong></span>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="420" height="600" aria-label="Jordi Road Rush spel"></canvas>
      <div class="overlay hidden" id="overlay">
        <h2 id="overlayTitle">GAME OVER!</h2>
        <p id="overlayText"></p>
        <button class="primary" id="againBtn">OPNIEUW SPELEN</button>
        <button class="secondary" id="changePlayerBtn" style="margin-top:10px">ANDERE SPELER</button>
      </div>
    </div>

    <div class="controls" aria-label="Spelbediening">
      <button class="ctrl up" data-dir="up" aria-label="Omhoog">▲</button>
      <button class="ctrl left" data-dir="left" aria-label="Links">◀</button>
      <button class="ctrl down" data-dir="down" aria-label="Omlaag">▼</button>
      <button class="ctrl right" data-dir="right" aria-label="Rechts">▶</button>
    </div>

    <div class="leaderboard" id="leaderboard">
      <h3>★ PERSOONLIJKE HIGHSCORES ★</h3>
      <div id="leaderRows"></div>
      <p class="small" style="text-align:center;margin:9px 0 0">Records worden op dit apparaat bewaard.</p>
    </div>
  </section>
  <footer>TIK OF DRUK OM OVER TE STEKEN • JORDI ARCADE</footer>
</main>

let playerName = '', score = 0, best = 0, playing = false, gameOver = false;

function loadScores(){ try { const v=JSON.parse(localStorage.getItem(STORAGE_SCORES)||'{}'); return v&&typeof v==='object'?v:{}; } catch(e){return{};} }
function saveScores(data){ try { localStorage.setItem(STORAGE_SCORES,JSON.stringify(data)); } catch(e){} }
function keyName(n){return n.trim().toLocaleLowerCase('nl-NL');}
function getBest(name){const s=loadScores();return s[keyName(name)]?.best||0;}
function renderScores(){
  const s=loadScores();
  const rows=Object.values(s).sort((a,b)=>b.best-a.best||a.name.localeCompare(b.name)).slice(0,5);
  $('leaderRows').innerHTML = '';
  if(!rows.length){$('leaderRows').innerHTML='<div class="score-row"><span>NOG GEEN RECORDS</span><span class="pts">—</span></div>';return;}
  rows.forEach(r=>{const div=document.createElement('div');div.className='score-row';const n=document.createElement('span');n.textContent=r.name;const p=document.createElement('span');p.className='pts';p.textContent=r.best+' PTS';div.append(n,p);$('leaderRows').append(div);});
}
function saveBestIfNeeded(){
  if(!playerName)return;
  const scores=loadScores(), key=keyName(playerName), old=scores[key]?.best||0;
  if(score>old){scores[key]={name:playerName,best:score};saveScores(scores);best=score;}
}
function updateHud(){$('hudName').textContent=playerName||'—';$('score').textContent=score;$('best').textContent=best;}
function beep(freq=440,duration=.06,type='square',vol=.035){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration);}catch(e){}
}
function makeLanes(){
  lanes=[];cars=[];
  const laneYs=[H-105,H-165,H-225,H-285,H-345,H-405,H-465];
  laneYs.forEach((y,i)=>{
    const dir=i%2===0?1:-1, speed=(105+i*13)*(dir===1?1:-1);
    lanes.push({y,dir,speed});
    const count=i%3===0?2:3, carW=i%3===0?62:48;
    for(let j=0;j<count;j++){
      const spacing=W/count;
      cars.push({x:j*spacing+(Math.random()*35),y:y-17,w:carW,h:28,vx:speed*(.83+Math.random()*.38),color:['#ff315d','#ffd52a','#22aaff','#ff8c24','#d45bff'][((i+j)%5)]});
    }
  });
}
function resetRound(){score=0;elapsed=0;player={x:W/2-13,y:H-39,w:26,h:29};particles=[];makeLanes();updateHud();gameOver=false;playing=true;$('overlay').classList.add('hidden');lastTime=performance.now();requestAnimationFrame(loop);}
function startGame(){
  const raw=$('playerName').value.trim();
  if(!raw){$('playerName').focus();return;}
  playerName=raw.slice(0,16);$('playerName').value=playerName;best=getBest(playerName);$('setup').classList.add('hidden');$('leaderboard').classList.add('hidden');updateHud();beep(660,.09);resetRound();
}
function finishGame(){
  if(gameOver)return;playing=false;gameOver=true;
  saveBestIfNeeded();best=getBest(playerName);updateHud();renderScores();beep(130,.3,'sawtooth',.05);
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const shout = new SpeechSynthesisUtterance('Jordi is dead!');
      shout.lang = 'en-US'; shout.rate = 0.82; shout.pitch = 0.65; shout.volume = 1;
      window.speechSynthesis.speak(shout);
    }
  }catch(e){}
  $('overlayTitle').textContent='JORDI IS DEAD!';
  $('overlayText').textContent=`SPELER: ${playerName}  •  SCORE: ${score} PTS  •  BEST: ${best} PTS`;
  $('overlay').classList.remove('hidden');$('leaderboard').classList.remove('hidden');
}
function cross(){score++;saveBestIfNeeded();best=getBest(playerName);updateHud();beep(700+Math.min(score*15,500),.07);particles.push({x:player.x+12,y:player.y+10,life:1});player.y=H-39;player.x=W/2-13;elapsed+=.45;}
function move(dx,dy){
  if(!playing)return;
  const step=dy<0?48:dy>0?40:35;
  player.x=Math.max(3,Math.min(W-player.w-3,player.x+dx*step));
  player.y=Math.max(5,Math.min(H-player.h-4,player.y+dy*step));
  beep(240+Math.random()*80,.025,'square',.018);
  if(player.y<=8)cross();
}
function drawBackground(){
  ctx.fillStyle='#08090d';ctx.fillRect(0,0,W,H);
  // Safe grass strips
  ctx.fillStyle='#06351f';ctx.fillRect(0,0,W,58);ctx.fillRect(0,H-56,W,56);
  for(let x=8;x<W;x+=28){ctx.fillStyle='#0a5630';ctx.fillRect(x,10,13,4);ctx.fillRect(x+6,H-26,10,4);}
  // Road surface
  ctx.fillStyle='#24242b';ctx.fillRect(0,58,W,H-114);
  ctx.strokeStyle='#6a6a75';ctx.lineWidth=2;ctx.setLineDash([18,15]);
  lanes.forEach(l=>{ctx.beginPath();ctx.moveTo(0,l.y+16);ctx.lineTo(W,l.y+16);ctx.stroke();});
  ctx.setLineDash([]);
  // Road edge
  ctx.fillStyle='#ffe600';ctx.fillRect(0,59,W,3);ctx.fillRect(0,H-58,W,3);
  // pixel trees on safe strips
  for(let x=22;x<W;x+=80){ctx.fillStyle='#00a84f';ctx.fillRect(x,18,17,23);ctx.fillStyle='#7a4b25';ctx.fillRect(x+6,39,5,9);ctx.fillRect(x+4,H-43,16,17);ctx.fillStyle='#00a84f';ctx.fillRect(x,H-48,24,14);}
}
function drawCars(){
  cars.forEach(c=>{
    ctx.fillStyle='#000';ctx.fillRect(c.x+2,c.y+4,c.w,c.h);
    ctx.fillStyle=c.color;ctx.fillRect(c.x,c.y,c.w,c.h-5);
    ctx.fillStyle='#bffaff';ctx.fillRect(c.x+c.w*.2,c.y+4,c.w*.25,7);ctx.fillRect(c.x+c.w*.56,c.y+4,c.w*.23,7);
    ctx.fillStyle='#ffe600';ctx.fillRect(c.vx>0?c.x+c.w-4:c.x,c.y+17,4,5);
    ctx.fillStyle='#111';ctx.fillRect(c.x+7,c.y+c.h-8,11,7);ctx.fillRect(c.x+c.w-18,c.y+c.h-8,11,7);
    ctx.fillStyle='#777';ctx.fillRect(c.x+9,c.y+c.h-7,7,4);ctx.fillRect(c.x+c.w-16,c.y+c.h-7,7,4);
  });
}
function drawPlayer(){
  if(characterImg&&characterImg.complete&&characterImg.naturalWidth){
    ctx.save();ctx.shadowColor='#00ffd5';ctx.shadowBlur=8;
    const drawH=38, drawW=drawH*(characterImg.naturalWidth/characterImg.naturalHeight);
    ctx.drawImage(characterImg,player.x+(player.w-drawW)/2,player.y,drawW,drawH);ctx.restore();
  }else{
    // Tiny original pixel character, no external assets needed
    const x=Math.round(player.x),y=Math.round(player.y);
    ctx.fillStyle='#e6a06b';ctx.fillRect(x+6,y+1,14,13);ctx.fillRect(x+4,y+7,18,12);
    ctx.fillStyle='#6d351e';ctx.fillRect(x+5,y,14,5);ctx.fillRect(x+3,y+3,4,5);ctx.fillRect(x+18,y+2,4,5);
    ctx.fillStyle='#fff';ctx.fillRect(x+8,y+5,4,5);ctx.fillRect(x+15,y+5,4,5);
    ctx.fillStyle='#111';ctx.fillRect(x+10,y+6,2,3);ctx.fillRect(x+17,y+6,2,3);
    ctx.fillStyle='#ffcf33';ctx.fillRect(x+7,y+18,5,9);ctx.fillRect(x+15,y+18,5,9);
    ctx.fillStyle='#00ffd5';ctx.fillRect(x+5,y+15,16,7);
    ctx.fillStyle='#fff';ctx.fillRect(x+13,y+13,5,2);
  }
}
function drawParticles(dt){particles.forEach(p=>{p.life-=dt*1.5;ctx.fillStyle=`rgba(255,230,0,${Math.max(0,p.life)})`;ctx.fillRect(p.x+Math.random()*14,p.y+Math.random()*12,3,3);});particles=particles.filter(p=>p.life>0);}
function draw(){
  drawBackground();drawCars();drawParticles(0.016);drawPlayer();
  ctx.fillStyle='#00ffd5';ctx.font='bold 12px Courier New';ctx.textAlign='left';ctx.fillText('LEVEL '+(1+Math.floor(score/5)),10,82);
}
function loop(now){
  if(!playing)return;
  const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;elapsed+=dt;
  const speedBoost=1+Math.min(score*.035,.8);
  cars.forEach(c=>{
    c.x+=c.vx*speedBoost*dt;
    if(c.vx>0&&c.x>W+8)c.x=-c.w-8;
    if(c.vx<0&&c.x<-c.w-8)c.x=W+8;
    const px=player.x+4,py=player.y+5,pw=player.w-8,ph=player.h-8;
    if(px<c.x+c.w-5&&px+pw>c.x+5&&py<c.y+c.h-4&&py+ph>c.y+3)finishGame();
  });
  draw();
  if(playing)requestAnimationFrame(loop);
}
function drawIdle(){
  lanes=[];cars=[];
  ctx.fillStyle='#08090d';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#06351f';ctx.fillRect(0,0,W,58);ctx.fillRect(0,H-56,W,56);
  ctx.fillStyle='#24242b';ctx.fillRect(0,58,W,H-114);
  ctx.fillStyle='#ffe600';ctx.fillRect(0,59,W,3);ctx.fillRect(0,H-58,W,3);
  ctx.setLineDash([18,15]);ctx.strokeStyle='#777';ctx.lineWidth=2;
  for(let y=115;y<H-65;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.setLineDash([]);
  for(let i=0;i<4;i++){const y=85+i*125;ctx.fillStyle=['#ff315d','#ffd52a','#22aaff','#ff8c24'][i];ctx.fillRect((i*113+30)%340,y,62,26);ctx.fillStyle='#bffaff';ctx.fillRect((i*113+42)%340,y+4,14,7);}
  player={x:W/2-13,y:H-39,w:26,h:29};drawPlayer();
  ctx.textAlign='center';ctx.fillStyle='#00ffd5';ctx.font='bold 18px Courier New';ctx.fillText('CROSS THE ROAD!',W/2,H/2);
  ctx.fillStyle='#ffe600';ctx.font='12px Courier New';ctx.fillText('PRESS START',W/2,H/2+24);
}
function loadEmbeddedCharacter(){
  characterImg = new Image();
  characterImg.onload = () => drawIdle();
  characterImg.src = EMBEDDED_CHARACTER;
}
$('startBtn').addEventListener('click',startGame);
$('playerName').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});
$('againBtn').addEventListener('click',()=>{ $('overlay').classList.add('hidden');$('leaderboard').classList.add('hidden'); resetRound(); });
$('changePlayerBtn').addEventListener('click',()=>{$('overlay').classList.add('hidden');$('setup').classList.remove('hidden');$('playerName').value='';$('playerName').focus();playing=false;gameOver=false;drawIdle();});
document.querySelectorAll('[data-dir]').forEach(btn=>{
  const act=e=>{e.preventDefault();const d=btn.dataset.dir;move(d==='left'?-1:d==='right'?1:0,d==='up'?-1:d==='down'?1:0);};
  btn.addEventListener('click',act);
});
window.addEventListener('keydown',e=>{
  const target=e.target;
  if(target && (target.matches('input, textarea, select') || target.isContentEditable)) return;
  const k=e.key.toLowerCase();
  if(!playing)return;
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k))e.preventDefault();
  if(k==='arrowup'||k==='w'||k===' ')move(0,-1);
  else if(k==='arrowdown'||k==='s')move(0,1);
  else if(k==='arrowleft'||k==='a')move(-1,0);
  else if(k==='arrowright'||k==='d')move(1,0);
});
canvas.addEventListener('pointerdown',e=>{
  if(!playing)return;
  const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  if(y<.48)move(0,-1);else if(x<.34)move(-1,0);else if(x>.66)move(1,0);else move(0,-1);
});
loadEmbeddedCharacter();
renderScores();drawIdle();
})();
</script>
