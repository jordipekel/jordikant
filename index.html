    &lt;!-- JAVASCRIPT FOR CLOCK, AUDIO &amp; PARTICLES --&gt;
    &lt;script&gt;
        /* ===================================================
           1. RETRO AUDIO SYNTHESIZER (Web Audio API)
           =================================================== */
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(freq = 800, type = &#39;square&#39;, duration = 0.08) {
                if (!this.enabled) return;
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + duration);
                } catch(e) {}
            }
        }

        const audio = new RetroAudio();

        function playBeep() {
            audio.playBeep(900, &#39;square&#39;, 0.06);
        }

        // Sound Toggle
        const soundBtn = document.getElementById(&#39;soundToggleBtn&#39;);
        const soundIcon = document.getElementById(&#39;soundIcon&#39;);
        const soundText = document.getElementById(&#39;soundText&#39;);

        soundBtn.addEventListener(&#39;click&#39;, () =&gt; {
            audio.enabled = !audio.enabled;
            if (audio.enabled) {
                soundIcon.className = &quot;fa-solid fa-volume-high text-neon-cyan&quot;;
                soundText.innerText = &quot;RETRO GELUID: AAN&quot;;
                audio.playBeep(1200, &#39;sine&#39;, 0.1);
            } else {
                soundIcon.className = &quot;fa-solid fa-volume-xmark text-gray-500&quot;;
                soundText.innerText = &quot;RETRO GELUID: UIT&quot;;
            }
        });

        /* ===================================================
           2. NETHERLANDS RETRO REAL-TIME CLOCK
           =================================================== */
        let is24HourFormat = true;

        const hoursEl = document.getElementById(&#39;hours&#39;);
        const minutesEl = document.getElementById(&#39;minutes&#39;);
        const secondsEl = document.getElementById(&#39;seconds&#39;);
        const ampmEl = document.getElementById(&#39;ampm&#39;);
        const fullDateEl = document.getElementById(&#39;fullDate&#39;);
        const timeFormatBtn = document.getElementById(&#39;timeFormatBtn&#39;);
        const formatLabel = document.getElementById(&#39;formatLabel&#39;);
        const timeZoneBadge = document.getElementById(&#39;timeZoneBadge&#39;);

        function updateClock() {
            const now = new Date();
            
            const optionsTime = { timeZone: &#39;Europe/Amsterdam&#39;, hour12: !is24HourFormat, hour: &#39;2-digit&#39;, minute: &#39;2-digit&#39;, second: &#39;2-digit&#39; };
            const timeParts = new Intl.DateTimeFormat(&#39;nl-NL&#39;, optionsTime).formatToParts(now);

            let hrs = &#39;00&#39;, mins = &#39;00&#39;, secs = &#39;00&#39;, dayPeriod = &#39;&#39;;

            timeParts.forEach(part =&gt; {
                if (part.type === &#39;hour&#39;) hrs = part.value;
                if (part.type === &#39;minute&#39;) mins = part.value;
                if (part.type === &#39;second&#39;) secs = part.value;
                if (part.type === &#39;dayPeriod&#39;) dayPeriod = part.value.toUpperCase();
            });

            hoursEl.innerText = hrs;
            minutesEl.innerText = mins;
            secondsEl.innerText = secs;

            if (!is24HourFormat) {
                ampmEl.innerText = dayPeriod;
                ampmEl.classList.remove(&#39;hidden&#39;);
            } else {
                ampmEl.classList.add(&#39;hidden&#39;);
            }

            const optionsDate = { timeZone: &#39;Europe/Amsterdam&#39;, weekday: &#39;long&#39;, day: &#39;numeric&#39;, month: &#39;long&#39;, year: &#39;numeric&#39; };
            let dutchDate = new Intl.DateTimeFormat(&#39;nl-NL&#39;, optionsDate).format(now);
            
            fullDateEl.innerText = dutchDate.toUpperCase();

            const isDST = new Intl.DateTimeFormat(&#39;en-US&#39;, { timeZone: &#39;Europe/Amsterdam&#39;, timeZoneName: &#39;short&#39; })
                .formatToParts(now).find(p =&gt; p.type === &#39;timeZoneName&#39;)?.value === &#39;GMT+2&#39; || false;
            
            timeZoneBadge.innerText = isDST ? &#39;UTC+2 (CEST)&#39; : &#39;UTC+1 (CET)&#39;;
        }

        timeFormatBtn.addEventListener(&#39;click&#39;, () =&gt; {
            is24HourFormat = !is24HourFormat;
            formatLabel.innerText = is24HourFormat ? &#39;24-UUR&#39; : &#39;12-UUR&#39;;
            audio.playBeep(1000, &#39;triangle&#39;, 0.08);
            updateClock();
        });

        updateClock();
        setInterval(updateClock, 1000);

        /* ===================================================
           3. BACKGROUND PARTICLE CANVAS
           =================================================== */
        const bgCanvas = document.getElementById(&#39;bgCanvas&#39;);
        const bgCtx = bgCanvas.getContext(&#39;2d&#39;);

        function resizeBgCanvas() {
            bgCanvas.width = bgCanvas.parentElement.clientWidth;
            bgCanvas.height = bgCanvas.parentElement.clientHeight;
        }
        resizeBgCanvas();
        window.addEventListener(&#39;resize&#39;, resizeBgCanvas);

        const particles = Array.from({ length: 25 }, () =&gt; ({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            size: Math.random() * 2 + 1,
            speedY: (Math.random() * 0.4 + 0.1),
            color: Math.random() &gt; 0.5 ? &#39;#00ff66&#39; : &#39;#00f3ff&#39;
        }));

        function animateBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p =&gt; {
                p.y -= p.speedY;
                if (p.y &lt; 0) {
                    p.y = bgCanvas.height;
                    p.x = Math.random() * bgCanvas.width;
                }
                bgCtx.fillStyle = p.color;
                bgCtx.fillRect(p.x, p.y, p.size, p.size);
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        /* ===================================================
           4. TOAST NOTIFICATION UTILS
           =================================================== */
        function showToast(msg) {
            const toast = document.getElementById(&#39;toast&#39;);
            const toastMsg = document.getElementById(&#39;toastMsg&#39;);
            toastMsg.innerText = msg;
            toast.classList.remove(&#39;translate-y-20&#39;, &#39;opacity-0&#39;);
            
            setTimeout(() =&gt; {
                toast.classList.add(&#39;translate-y-20&#39;, &#39;opacity-0&#39;);
            }, 3000);
        }
    &lt;/script&gt;
