<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jordi Arcade</title>
  <style>
    * { box-sizing: border-box; }
body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0, #34205e 0, #100d20 45%, #03040a 100%);
      color: #eaf4ff;
      font-family: Arial, sans-serif;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .cabinet {
      max-width: 1000px;
      margin: 0 auto;
      padding: 14px;
      background: linear-gradient(135deg, #34364b, #101321 30%, #25283d 65%, #080a12);
      border: 4px solid #59617c;
      border-radius: 24px;
      box-shadow: 0 0 0 3px #090b15, 0 0 35px #8b4dff55, inset 0 0 20px #000;
      position: relative;
    }
    .marquee {
      margin: 0 0 12px;
      text-align: center;
      padding: 12px 10px;
      background: linear-gradient(180deg, #080914, #19132d);
      border: 2px solid #77718e;
      border-radius: 14px;
      box-shadow: inset 0 0 14px #000, 0 0 14px #ff38d433;
    }
    .logo {
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 1000;
      letter-spacing: 4px;
      color: #f7f5ff;
      text-shadow: 0 0 8px #21d9ff, 0 0 18px #21d9ff;
    }
    .logo span {
      color: #ff38d4;
      text-shadow: 0 0 10px #ff38d4;
    }
    .sub {
      color: #ffd447;
      font-size: 10px;
      letter-spacing: 3px;
      margin-top: 4px;
    }
    .cabinet-body {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: 14px;
    }
    .panel {
      background: linear-gradient(145deg, #171a2d, #070914);
      border: 2px solid #4c5576;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 18px #000, 0 4px 10px #0008;
    }
    .head {
      padding: 10px;
      background: linear-gradient(90deg, #15132a, #20223b);
      color: #21d9ff;
      letter-spacing: 2px;
      border-bottom: 2px solid #41476b;
      font-weight: bold;
      text-align: center;
      font-size: 12px;
    }
    .list {
      padding: 8px;
      max-height: 420px;
      overflow: auto;
    }
    .game {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      margin-bottom: 6px;
      border: 2px solid #303958;
      border-radius: 6px;
      background: #090d20;
      color: #eaf4ff;
      text-align: left;
      cursor: pointer;
    }
    .game.selected, .game:hover {
      border-color: #ff38d4;
      background: linear-gradient(90deg, #35104c, #111d3b);
      box-shadow: 0 0 12px #ff38d477;
    }
    .thumb {
      width: 46px;
      height: 36px;
      object-fit: cover;
      border: 1px solid #7780a5;
      border-radius: 4px;
      flex: none;
    }
    .game strong { font-size: 13px; }
    .screen-bezel {
      margin: 12px;
      padding: 10px;
      background: linear-gradient(145deg, #080a12, #30344a 45%, #090b14);
      border: 2px solid #747b99;
      border-radius: 14px;
      box-shadow: inset 0 0 16px #000, 0 0 14px #21d9ff33;
    }
    .screen {
      height: 320px;
      border: 6px solid #080a11;
      border-radius: 8px;
      background: #020309;
      overflow: hidden;
      box-shadow: 0 0 0 2px #21d9ff, 0 0 16px #21d9ff66;
      position: relative;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .screen-label {
      text-align: center;
      color: #7eebff;
      font-size: 9px;
      letter-spacing: 2px;
      padding: 6px 0 0;
    }
    .details {
      padding: 4px 14px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .details h2 {
      margin: 0 0 4px;
      color: #ffd447;
      font-size: clamp(18px, 2.5vw, 26px);
      text-transform: uppercase;
    }
    .details p {
      color: #c1cbed;
      font-size: 12px;
      line-height: 1.4;
      margin: 0;
    }
    .btn {
      border: 2px solid #21d9ff;
      border-radius: 6px;
      background: linear-gradient(#42e8ff, #08a9d2);
      color: #04101a;
      padding: 10px 14px;
      font-weight: 1000;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 10px #21d9ff55;
    }
    .btn.alt {
      background: linear-gradient(#343852, #171a2c);
      color: #eaf4ff;
      border-color: #777d9c;
      box-shadow: none;
    }
    .deck {
      margin-top: 12px;
      padding: 10px 14px;
      border: 2px solid #454c6b;
      border-radius: 10px;
      background: linear-gradient(180deg, #25283c, #0a0c16);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: inset 0 0 14px #000;
    }
    .controls { display: flex; gap: 6px; align-items: center; }
    .control-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff315b;
      box-shadow: 0 0 10px #ff315b;
    }
    .control-dot.blue {
      background: #21d9ff;
      box-shadow: 0 0 10px #21d9ff;
    }
    .hint {
      color: #aeb9df;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
    }
    @media (max-width: 760px) {
      body { padding: 4px; }
      .cabinet { padding: 8px; border-radius: 16px; }
      .cabinet-body { grid-template-columns: 1fr; }
      .list { max-height: 180px; }
      .screen { height: 240px; }
      .details { grid-template-columns: 1fr; }
      .details .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <header class="marquee">
      <div class="logo">JORDI <span>ARCADE</span></div>
      <div class="sub">★ INSERT COIN · SELECT YOUR GAME · PRESS START ★</div>
    </header>
    <div class="cabinet-body">
      <section class="panel" id="menuPanel">
        <div class="head">★ GAME SELECT ★</div>
        <div id="list" class="list"></div>
        <div class="deck">
          <button class="btn alt" id="up">▲ OMHOOG</button>
          <button class="btn alt" id="down">▼ OMLAAG</button>
        </div>
      </section>
      <section class="panel">
        <div class="head">▣ ARCADE DISPLAY</div>
        <div class="screen-bezel">
          <div id="screen" class="screen"></div>
          <div class="screen-label">JORDI ARCADE · PLAYER 1</div>
        </div>
        <div class="details">
          <div>
            <h2 id="title"></h2>
            <p id="desc"></p>
          </div>
          <button id="play" class="btn">▶ START GAME</button>
        </div>
      </section>
    </div>
    <footer class="deck">
      <div class="controls">
        <span class="control-dot"></span>
        <span class="control-dot blue"></span>
      </div>
      <div class="hint">PIJLTJES = KIEZEN &nbsp; · &nbsp; ENTER = START</div>
    </footer>
  </main>
  <script>
    const games = [{"name":"Pac-Jordi","category":"Arcade","description":"Disclaimer: Pac-Jordi is een onafhankelijk hobbyproject.","folder":"spel-01-pac-jordi","html":"index.html","cover":"Cover-pacjordi.png"},{"name":"Blokkenbreker","category":"Arcade","description":"Disclaimer: Blokkenbreker is een onafhankelijk hobbyproject.","folder":"spel-02-blokkenbreker","html":"index.html","cover":"Blokkenbrekercover.png"},{"name":"Flappy-Jordi","category":"Overig","description":"Disclaimer: Flappy-Jordi is een onafhankelijk hobbyproject.","folder":"spel-03-flappy-jordi","html":"index.html","cover":"flappyjordicover.png"},{"name":"Jordi steekt over","category":"Arcade","description":"Disclaimer: Jordi steekt over is een onafhankelijk hobbyproject.","folder":"spel-04-jordi-steekt-over","html":"index.html","cover":"Jordi-Steekt-Over-cover.jpg"},{"name":"Jordi vip fruit slot","category":"Casino","description":"Disclaimer: Jordi vip fruit slot is een onafhankelijk hobbyproject.","folder":"spel-05-jordi-vip-fruit-slot","html":"index.html","cover":"Jordi-VIP-Fruit-Slot-Cover.png"}];
    let selected = 0;
    const list = document.getElementById('list'), screen = document.getElementById('screen');
    
    function assetUrl(g, p) {
      return 'arcade-games/' + g.folder + '/' + p.split('/').map(encodeURIComponent).join('/');
    }
    
    function render() {
      list.innerHTML = '';
      games.forEach((g, i) => {
        const b = document.createElement('button');
        b.className = 'game' + (i === selected ? ' selected' : '');
        const im = document.createElement('img');
        im.className = 'thumb';
        im.src = assetUrl(g, g.cover);
        const t = document.createElement('strong');
        t.textContent = g.name;
        b.append(im, t);
        b.onclick = () => { selected = i; render(); };
        list.append(b);
      });
      const g = games[selected];
      document.getElementById('title').textContent = g.name;
      document.getElementById('desc').textContent = g.category + ' · ' + (g.description || 'Druk op START GAME om te spelen.');
      screen.innerHTML = '';
      const im = document.createElement('img');
      im.src = assetUrl(g, g.cover);
      im.alt = g.name;
      screen.append(im);
      list.children[selected]?.scrollIntoView({ block: 'nearest' });
    }
    
function play() {
      if (!games.length) return;
      const g = games[selected];
      const url = assetUrl(g, g.html);
      
      // Opent het spel in een nieuw tabblad/webpagina
      window.open(url, '_blank');
    }
    
    function move(d) {
      if (!games.length) return;
      selected = (selected + d + games.length) % games.length;
      render();
    }
    
    document.getElementById('play').onclick = play;
    document.getElementById('up').onclick = () => move(-1);
    document.getElementById('down').onclick = () => move(1);
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); play(); }
    });
    render();
  </script>
</body>
</html>
