sans-serif;border:1px solid #38596a}.jws-mobile-link:focus,.jws-mobile-link:hover{background:#6596b0}.jws-mobile-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;padding:10px;border:0;border-radius:4px;background:#5c8aa3;cursor:pointer}.jws-mobile-toggle span{display:block;height:2px;width:100%;background:white;border-radius:2px}.jws-responsive-nav{overflow:visible!important}}.jws-desktop-links{display:flex;align-items:center;gap:18px}.jws-mobile-toggle{display:none}
</style>

<script>
(function(){const c=document.querySelector('.site-canvas'),w=1200,h=1521;function fit(){const s=Math.min(1,window.innerWidth/w);c.style.setProperty('--jws-scale',s);c.style.transform='scale('+s+')';document.body.style.height=(h*s)+'px'}fit();window.addEventListener('resize',fit)})();
</script>
<script>
document.querySelectorAll('.jws-responsive-nav').forEach(nav=>{const toggle=nav.querySelector('.jws-mobile-toggle'),panel=nav.querySelector('.jws-mobile-panel'),close=nav.querySelector('.jws-mobile-close');if(!toggle||!panel)return;const open=()=>{panel.hidden=false;toggle.setAttribute('aria-expanded','true');toggle.setAttribute('aria-label','Menu sluiten');document.body.style.overflow='hidden'};const shut=()=>{panel.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Menu openen');document.body.style.overflow=''};toggle.addEventListener('click',()=>panel.hidden?open():shut());close?.addEventListener('click',shut);panel.addEventListener('click',ev=>{if(ev.target===panel)shut()});panel.querySelectorAll('a').forEach(a=>a.addEventListener('click',shut));document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!panel.hidden)shut()});});
</script>
<script>
(function(){function tickVistaClock(){var now=new Date();var hh=String(now.getHours()).padStart(2,'0');var mm=String(now.getMinutes()).padStart(2,'0');document.querySelectorAll('.jws-vista-clock-live,.jws-xp-clock-live').forEach(function(el){el.textContent=hh+':'+mm;});}tickVistaClock();setInterval(tickVistaClock,15000);})();
</script>
