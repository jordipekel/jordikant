                    &lt;i class=&quot;fa-solid fa-wand-magic-sparkles&quot;&gt;&lt;/i&gt; BLASTER ZAP
                &lt;/button&gt;
                &lt;button onclick=&quot;playArcadeSfx(&#39;extralife&#39;)&quot; class=&quot;arcade-btn p-3 rounded-xl flex items-center justify-center gap-2 text-emerald-400 cursor-pointer&quot;&gt;
                    &lt;i class=&quot;fa-solid fa-heart&quot;&gt;&lt;/i&gt; EXTRA LIFE
                &lt;/button&gt;
                &lt;button onclick=&quot;playArcadeSfx(&#39;gameover&#39;)&quot; class=&quot;arcade-btn p-3 rounded-xl flex items-center justify-center gap-2 text-orange-500 cursor-pointer&quot;&gt;
                    &lt;i class=&quot;fa-solid fa-skull&quot;&gt;&lt;/i&gt; GAME OVER
                &lt;/button&gt;
            &lt;/div&gt;
        &lt;/section&gt;

    &lt;/main&gt;

    &lt;!-- AUDIO ENGINE SCRIPT --&gt;
    &lt;script&gt;
        /* ===================================================
           1. WEB AUDIO API CONTEXT &amp; ENGINE
           =================================================== */
        let audioCtx = null;
        let analyser = null;
        let masterGain = null;
        let currentWaveform = &#39;square&#39;;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                
                masterGain = audioCtx.createGain();
                masterGain.gain.value = parseFloat(document.getElementById(&#39;masterVolume&#39;).value);
                
                masterGain.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                setupVisualizer();
            }
            if (audioCtx.state === &#39;suspended&#39;) {
                audioCtx.resume();
            }
        }

        // Master Volume Handler
        document.getElementById(&#39;masterVolume&#39;).addEventListener(&#39;input&#39;, (e) =&gt; {
            if (masterGain) {
                masterGain.gain.value = parseFloat(e.target.value);
            }
        });

        // Waveform Buttons
        document.querySelectorAll(&#39;.wave-btn&#39;).forEach(btn =&gt; {
            btn.addEventListener(&#39;click&#39;, () =&gt; {
                document.querySelectorAll(&#39;.wave-btn&#39;).forEach(b =&gt; {
                    b.classList.remove(&#39;active&#39;, &#39;bg-neon-green&#39;, &#39;text-black&#39;, &#39;font-bold&#39;);
                    b.classList.add(&#39;bg-black&#39;, &#39;text-neon-green&#39;);
                });
                btn.classList.add(&#39;active&#39;, &#39;bg-neon-green&#39;, &#39;text-black&#39;, &#39;font-bold&#39;);
                btn.classList.remove(&#39;bg-black&#39;, &#39;text-neon-green&#39;);
                currentWaveform = btn.getAttribute(&#39;data-wave&#39;);
            });
        });

        /* ===================================================
           2. SYNTH KEYBOARD LOGIC
           =================================================== */
        const noteFreqs = {
            &#39;C4&#39;: 261.63, &#39;C#4&#39;: 277.18, &#39;D4&#39;: 293.66, &#39;D#4&#39;: 311.13, &#39;E4&#39;: 329.63,
            &#39;F4&#39;: 349.23, &#39;F#4&#39;: 369.99, &#39;G4&#39;: 392.00, &#39;G#4&#39;: 415.30, &#39;A4&#39;: 440.00,
            &#39;A#4&#39;: 466.16, &#39;B4&#39;: 493.88, &#39;C5&#39;: 523.25
        };

        const activeOscillators = {};

        function playNote(note) {
            initAudio();
            if (activeOscillators[note]) return; // Avoid re-triggering same note

            const freq = noteFreqs[note];
            if (!freq) return;

            const osc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();

            osc.type = currentWaveform;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Envelope (Attack &amp; Release)
            noteGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            noteGain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);

            osc.connect(noteGain);
            noteGain.connect(masterGain);

            osc.start();
            activeOscillators[note] = { osc, gain: noteGain };

            document.getElementById(&#39;noteDisplay&#39;).innerText = `NOTE: ${note}`;
        }

        function stopNote(note) {
            if (activeOscillators[note]) {
                const { osc, gain } = activeOscillators[note];
                gain.gain.setValueAtTime(gain.gain.value, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                setTimeout(() =&gt; {
                    osc.stop();
                    osc.disconnect();
                }, 100);
                delete activeOscillators[note];
            }
            if (Object.keys(activeOscillators).length === 0) {
                document.getElementById(&#39;noteDisplay&#39;).innerText = &#39;NO NOTE&#39;;
            }
        }

        // Attach Mouse &amp; Touch Events to Keys
        const keyBtns = document.querySelectorAll(&#39;.key-btn&#39;);
        keyBtns.forEach(btn =&gt; {
            const note = btn.getAttribute(&#39;data-note&#39;);

            const startPlay = (e) =&gt; {
                e.preventDefault();
                btn.classList.add(&#39;active&#39;);
                playNote(note);
            };

            const stopPlay = (e) =&gt; {
                e.preventDefault();
                btn.classList.remove(&#39;active&#39;);
                stopNote(note);
            };

            btn.addEventListener(&#39;mousedown&#39;, startPlay);
            btn.addEventListener(&#39;mouseup&#39;, stopPlay);
            btn.addEventListener(&#39;mouseleave&#39;, stopPlay);

            btn.addEventListener(&#39;touchstart&#39;, startPlay);
            btn.addEventListener(&#39;touchend&#39;, stopPlay);
        });

        // Keyboard Shortcut Mapping
        const keyMap = {
            &#39;a&#39;: &#39;C4&#39;, &#39;w&#39;: &#39;C#4&#39;, &#39;s&#39;: &#39;D4&#39;, &#39;e&#39;: &#39;D#4&#39;, &#39;d&#39;: &#39;E4&#39;,
            &#39;f&#39;: &#39;F4&#39;, &#39;t&#39;: &#39;F#4&#39;, &#39;g&#39;: &#39;G4&#39;, &#39;y&#39;: &#39;G#4&#39;, &#39;h&#39;: &#39;A4&#39;,
            &#39;u&#39;: &#39;A#4&#39;, &#39;j&#39;: &#39;B4&#39;, &#39;k&#39;: &#39;C5&#39;
        };

        window.addEventListener(&#39;keydown&#39;, (e) =&gt; {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            if (keyMap[key]) {
                const note = keyMap[key];
                const btn = document.querySelector(`[data-note=&quot;${note}&quot;]`);
                if (btn) btn.classList.add(&#39;active&#39;);
                playNote(note);
            }
        });

        window.addEventListener(&#39;keyup&#39;, (e) =&gt; {
            const key = e.key.toLowerCase();
            if (keyMap[key]) {
                const note = keyMap[key];
                const btn = document.querySelector(`[data-note=&quot;${note}&quot;]`);
                if (btn) btn.classList.remove(&#39;active&#39;);
                stopNote(note);
            }
        });

        /* ===================================================
           3. ARCADE SOUND EFFECTS GENERATOR
           =================================================== */
        function playArcadeSfx(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(masterGain);

            if (type === &#39;laser&#39;) {
                osc.type = &#39;sawtooth&#39;;
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } 
            else if (type === &#39;jump&#39;) {
                osc.type = &#39;square&#39;;
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } 
            else if (type === &#39;coin&#39;) {
                osc.type = &#39;square&#39;;
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } 
            else if (type === &#39;powerup&#39;) {
                osc.type = &#39;triangle&#39;;
                const notes = [330, 392, 659, 523, 587, 784];
                notes.forEach((f, i) =&gt; {
                    osc.frequency.setValueAtTime(f, now + (i * 0.05));
                });
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
            else if (type === &#39;bomb&#39;) {
                osc.type = &#39;sawtooth&#39;;
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
            else if (type === &#39;zap&#39;) {
                osc.type = &#39;square&#39;;
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
            else if (type === &#39;extralife&#39;) {
                osc.type = &#39;square&#39;;
                const notes = [261, 329, 392, 523, 659];
                notes.forEach((f, i) =&gt; {
                    osc.frequency.setValueAtTime(f, now + (i * 0.06));
                });
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
            else if (type === &#39;gameover&#39;) {
                osc.type = &#39;sawtooth&#39;;
                const notes = [400, 350, 300, 250];
                notes.forEach((f, i) =&gt; {
                    osc.frequency.setValueAtTime(f, now + (i * 0.12));
                });
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        /* ===================================================
           4. CHIPTUNE RETRO ARPEGGIATOR LOOPER
           =================================================== */
        let isLooping = false;
        let loopInterval = null;
        let loopIndex = 0;
        const arpeggioNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; // C - E - G - C5

        const loopToggleBtn = document.getElementById(&#39;loopToggleBtn&#39;);
        const bpmSlider = document.getElementById(&#39;bpmSlider&#39;);
        const bpmVal = document.getElementById(&#39;bpmVal&#39;);

        bpmSlider.addEventListener(&#39;input&#39;, (e) =&gt; {
            bpmVal.innerText = e.target.value;
            if (isLooping) {
                stopLoop();
                startLoop();
            }
        });

        function startLoop() {
            initAudio();
            isLooping = true;
            loopToggleBtn.innerHTML = `&lt;i class=&quot;fa-solid fa-stop&quot;&gt;&lt;/i&gt;&lt;span&gt;STOP LOOP&lt;/span&gt;`;
            loopToggleBtn.classList.add(&#39;bg-neon-cyan&#39;, &#39;text-black&#39;);

            const bpm = parseInt(bpmSlider.value);
            const intervalMs = (60 / bpm / 2) * 1000;

            loopInterval = setInterval(() =&gt; {
                const freq = arpeggioNotes[loopIndex % arpeggioNotes.length];
                playArpTone(freq);
                loopIndex++;
            }, intervalMs);
        }

        function stopLoop() {
            isLooping = false;
            clearInterval(loopInterval);
            loopToggleBtn.innerHTML = `&lt;i class=&quot;fa-solid fa-play&quot;&gt;&lt;/i&gt;&lt;span&gt;START RETRO LOOP&lt;/span&gt;`;
            loopToggleBtn.classList.remove(&#39;bg-neon-cyan&#39;, &#39;text-black&#39;);
        }

        function playArpTone(freq) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = &#39;triangle&#39;;
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc.connect(gain);
            gain.connect(masterGain);

            osc.start(now);
            osc.stop(now + 0.12);
        }

        loopToggleBtn.addEventListener(&#39;click&#39;, () =&gt; {
            if (isLooping) {
                stopLoop();
            } else {
                startLoop();
            }
        });

        /* ===================================================
           5. CRT OSCILLOSCOPE VISUALIZER CANVAS
           =================================================== */
        function setupVisualizer() {
            const canvas = document.getElementById(&#39;visualizerCanvas&#39;);
            const ctx = canvas.getContext(&#39;2d&#39;);

            function resizeCanvas() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
            resizeCanvas();
            window.addEventListener(&#39;resize&#39;, resizeCanvas);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray);

                ctx.fillStyle = &#39;rgba(0, 5, 2, 0.25)&#39;;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.lineWidth = 2;
                ctx.strokeStyle = &#39;#00ff66&#39;;
                ctx.shadowBlur = 8;
                ctx.shadowColor = &#39;#00ff66&#39;;

                ctx.beginPath();
                const sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i &lt; bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    x += sliceWidth;
                }

                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
            }
            draw();
        }
    &lt;/script&gt;

.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.globalAlpha=1}}});raf=requestAnimationFrame(draw)}init();draw();addEventListener('resize',()=>{cancelAnimationFrame(raf);init();draw()})}document.querySelectorAll('.jws-particles').forEach(setupParticles);document.querySelectorAll('.jws-wheel').forEach(c=>{const ctx=c.getContext('2d'),prizes=(c.dataset.prizes||'Prijs 1|Prijs 2|Prijs 3').split('|').filter(Boolean),colors=['#526dff','#f59e0b','#10b981','#ec4899','#8b5cf6','#06b6d4'];function paint(rotation=0){const cx=c.width/2,cy=c.height/2,r=120,step=2*Math.PI/prizes.length;ctx.clearRect(0,0,c.width,c.height);prizes.forEach((p,i)=>{const a=i*step+rotation;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate(a+step/2);ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='right';ctx.fillText(p.slice(0,20),r-8,4);ctx.restore()});ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}paint();const wrap=c.parentElement,btn=wrap.querySelector('.jws-spin'),result=wrap.querySelector('.jws-wheel-result');let busy=false;btn.addEventListener('click',()=>{if(busy)return;busy=true;btn.disabled=true;const chosen=Math.floor(Math.random()*prizes.length),turns=5+Math.random()*3,start=performance.now(),duration=3200,step=2*Math.PI/prizes.length,target=turns*2*Math.PI+(Math.PI*1.5-(chosen+.5)*step);function anim(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);paint(target*ease);if(t<1)requestAnimationFrame(anim);else{result.textContent='Uitkomst: '+prizes[chosen];btn.disabled=false;busy=false}}requestAnimationFrame(anim)})});document.querySelectorAll('.jws-scratch-canvas').forEach(c=>{const ctx=c.getContext('2d');let down=false,ready=false;function init(){const r=c.getBoundingClientRect();if(!r.width||!r.height)return;c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);ctx.fillStyle=c.data
